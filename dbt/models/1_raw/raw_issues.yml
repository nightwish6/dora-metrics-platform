version: 2

models:
  - name: raw_issues
    description: "Raw GitHub issues from repository"
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: data
        data_tests:
          - not_null
      - name: source_name
        data_tests:
          - not_null
          - accepted_values:
              values: ['issues']
      - name: repo_name
        data_tests:
          - not_null
          - accepted_values:
              values: ['vscode', 'airflow']
      - name: loaded_at
        data_tests:
          - not_null
